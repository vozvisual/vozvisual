<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entre no Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, sans-serif; }
    .hero {
      background-size: cover;
      background-position: center;
      height: 100vh;
    }
    .arco {
      position: absolute;
      width: 40px;
      height: 40px;
      border: 3px solid #22d3ee;
      border-radius: 50%;
      pointer-events: none;
      animation: arcoAnim 0.8s ease-out forwards;
      box-shadow: 0 0 30px #22d3ee;
    }
    @keyframes arcoAnim {
      0% { transform: scale(0.2); opacity: 1; }
      100% { transform: scale(4); opacity: 0; }
    }
  </style>
</head>
<body class="bg-black text-zinc-200">

  <section id="hero" class="hero relative flex items-center justify-center overflow-hidden">
    <!-- Coloque aqui o link da imagem que você escolher -->
    <div onclick="criarArco(event)" class="text-center z-10 cursor-pointer">
      <h1 class="text-6xl md:text-7xl font-bold tracking-widest text-white neon-text">
        ENTRE NO PORTAL
      </h1>
    </div>
  </section>

  <script>
    function criarArco(e) {
      const arco = document.createElement('div');
      arco.className = 'arco';
      arco.style.left = (e.clientX - 20) + 'px';
      arco.style.top = (e.clientY - 20) + 'px';
      document.getElementById('hero').appendChild(arco);

      setTimeout(() => arco.remove(), 800);
    }
  </script>
</body>
</html>
