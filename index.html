
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Voz Visual — One Page Cinemático</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Estilo Cinemático Voz Visual -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: radial-gradient(circle at top, #0f172a 0%, #020617 40%, #000 100%);
      color: #e5e7eb;
      padding: 0;
      margin: 0;
      overflow-x: hidden;
    }

    /* HEADER */
    header {
      padding: 20px 6vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15,23,42,0.75);
      border-bottom: 1px solid rgba(148,163,184,0.25);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .logo {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: #38bdf8;
      text-transform: uppercase;
    }

    .auth-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-google {
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.6);
      background: rgba(15,23,42,0.8);
      color: #e5e7eb;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(15,23,42,0.9);
      border: 1px solid rgba(148,163,184,0.6);
      font-size: 0.8rem;
    }

    .user-chip img {
      width: 22px;
      height: 22px;
      border-radius: 50%;
    }

    .badge-admin {
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(248,250,252,0.08);
      border: 1px solid rgba(248,250,252,0.25);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* CONTAINER PRINCIPAL */
    main {
      padding: 40px 6vw 80px;
      max-width: 1400px;
      margin: auto;
    }

    /* BLOCO DO GERADOR */
    .generator-box {
      background: rgba(15,23,42,0.85);
      border: 1px solid rgba(148,163,184,0.35);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .generator-title {
      font-size: 1.4rem;
      font-weight: 600;
      color: #38bdf8;
      margin-bottom: 10px;
    }

    .generator-sub {
      font-size: 0.9rem;
      color: #9ca3af;
      margin-bottom: 20px;
    }

    textarea, input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(148,163,184,0.4);
      background: rgba(15,23,42,0.95);
      color: #e5e7eb;
      font-size: 0.9rem;
      margin-bottom: 14px;
    }

    button {
      padding: 10px 20px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f97316, #facc15);
      color: #0f172a;
    }

    .btn-secondary {
      background: rgba(15,23,42,0.8);
      border: 1px solid rgba(148,163,184,0.6);
      color: #e5e7eb;
    }

    /* PREVIEW DA IMAGEM GERADA */
    .image-preview {
      margin-top: 20px;
      background: rgba(15,23,42,0.9);
      border: 1px solid rgba(148,163,184,0.4);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }

    .image-preview img {
      max-width: 100%;
      border-radius: 14px;
      margin-top: 10px;
    }

    /* GALERIA MOSAICO (PINTEREST) */
    .gallery-title {
      font-size: 1.4rem;
      font-weight: 600;
      color: #38bdf8;
      margin-bottom: 20px;
    }

    .masonry {
      column-count: 3;
      column-gap: 16px;
    }

    .masonry-item {
      break-inside: avoid;
      margin-bottom: 16px;
      background: rgba(15,23,42,0.85);
      border: 1px solid rgba(148,163,184,0.35);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.35);
    }

    .masonry-item img {
      width: 100%;
      display: block;
    }

    .masonry-info {
      padding: 12px;
      font-size: 0.8rem;
      color: #9ca3af;
    }

    .masonry-title {
      font-size: 0.95rem;
      color: #e5e7eb;
      margin-bottom: 4px;
    }

    .masonry-actions {
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
    }

    .like-btn {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(248,250,252,0.18);
      background: rgba(15,23,42,0.9);
      color: #f97316;
      cursor: pointer;
    }

    .admin-remove {
      color: #fca5a5;
      cursor: pointer;
    }

    @media (max-width: 900px) {
      .masonry {
        column-count: 2;
      }
    }

    @media (max-width: 600px) {
      .masonry {
        column-count: 1;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">VOZ VISUAL</div>

    <div class="auth-area">
      <div id="user-info"></div>

      <button id="btn-google-login" class="btn-google">Entrar com Google</button>
      <button id="btn-google-logout" class="btn-google" style="display:none;">Sair</button>
    </div>
  </header>

  <main>

    <!-- GERADOR DE IMAGENS -->
    <div class="generator-box">
      <div class="generator-title">Gerador Cinematográfico (Grok)</div>
      <div class="generator-sub">
        Escreva um sentimento, cena ou ideia. Gere a imagem. Publique na galeria.
      </div>

      <textarea id="prompt-input" placeholder="Ex: solidão luminosa em uma cidade futurista, chuva, neon..."></textarea>

      <input type="text" id="grok-api-key" placeholder="Cole sua API Key do Grok (xAI) — começa com xai-..." />

      <button id="btn-generate" class="btn-primary">Gerar imagem</button>

      <div id="generate-status" style="margin-top:10px;font-size:0.8rem;color:#9ca3af;"></div>

      <div class="image-preview" id="image-preview" style="display:none;">
        <div style="font-size:0.85rem;color:#9ca3af;">Imagem gerada:</div>
        <img id="generated-image" src="" alt="Imagem gerada" />

        <button id="btn-publish" class="btn-secondary" style="margin-top:14px;">
          Publicar na galeria
        </button>

        <div id="publish-status" style="margin-top:10px;font-size:0.8rem;color:#9ca3af;"></div>
      </div>
    </div>

    <!-- GALERIA -->
    <div class="gallery-title">Galeria Viva (Mosaico)</div>

    <div class="masonry" id="gallery"></div>

  </main>
  <!-- FIREBASE + APP -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      query,
      orderBy,
      updateDoc,
      doc,
      deleteDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    import {
      getStorage,
      ref,
      uploadBytes,
      getDownloadURL
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

    /* === CONFIG FIREBASE (SEU PROJETO) === */
    const firebaseConfig = {
      apiKey: "AIzaSyDZI5fdFIU8yd9mZiDnFjQ0hiQTcmYm18A",
      authDomain: "voz-visual.firebaseapp.com",
      projectId: "voz-visual",
      storageBucket: "voz-visual.firebasestorage.app",
      messagingSenderId: "5180075793",
      appId: "1:5180075793:web:0cf9da29e6b383e9e0e6b0",
      measurementId: "G-PM0MWLQ7CD"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    const ADMIN_EMAIL = "vitorfabiano1008@gmail.com";

    /* === ELEMENTOS === */
    const btnLogin = document.getElementById("btn-google-login");
    const btnLogout = document.getElementById("btn-google-logout");
    const userInfo = document.getElementById("user-info");

    const promptInput = document.getElementById("prompt-input");
    const grokApiKeyInput = document.getElementById("grok-api-key");
    const btnGenerate = document.getElementById("btn-generate");
    const generateStatus = document.getElementById("generate-status");

    const imagePreview = document.getElementById("image-preview");
    const generatedImage = document.getElementById("generated-image");
    const btnPublish = document.getElementById("btn-publish");
    const publishStatus = document.getElementById("publish-status");

    const gallery = document.getElementById("gallery");

    let currentUser = null;
    let isAdmin = false;
    let lastGeneratedImageURL = null;

    /* === LOGIN GOOGLE === */
    const provider = new GoogleAuthProvider();

    btnLogin.addEventListener("click", async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        alert("Erro ao entrar: " + err.message);
      }
    });

    btnLogout.addEventListener("click", async () => {
      await signOut(auth);
    });

    onAuthStateChanged(auth, user => {
      currentUser = user;
      isAdmin = !!(user && user.email === ADMIN_EMAIL);

      if (user) {
        btnLogin.style.display = "none";
        btnLogout.style.display = "inline-flex";

        userInfo.innerHTML = `
          <div class="user-chip">
            <img src="${user.photoURL}" />
            <span>${user.displayName}</span>
            ${isAdmin ? `<span class="badge-admin">Admin</span>` : ""}
          </div>
        `;
      } else {
        btnLogin.style.display = "inline-flex";
        btnLogout.style.display = "none";
        userInfo.innerHTML = "";
      }

      loadGallery();
    });

    /* === GERAR IMAGEM COM GROK === */
    btnGenerate.addEventListener("click", async () => {
      const prompt = promptInput.value.trim();
      const apiKey = grokApiKeyInput.value.trim();

      if (!prompt) return alert("Escreva um prompt.");
      if (!apiKey) return alert("Cole sua API Key do Grok.");

      generateStatus.textContent = "Gerando imagem...";
      btnGenerate.disabled = true;

      try {
        const response = await fetch("https://api.x.ai/v1/images", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: "grok-vision-beta",
            prompt,
            size: "1024x1024"
          })
        });

        const data = await response.json();

        const url = data?.data?.[0]?.url;
        if (!url) throw new Error("Erro ao gerar imagem.");

        lastGeneratedImageURL = url;

        generatedImage.src = url;
        imagePreview.style.display = "block";
        generateStatus.textContent = "Imagem gerada com sucesso.";

      } catch (err) {
        console.error(err);
        generateStatus.textContent = "Erro ao gerar imagem.";
      }

      btnGenerate.disabled = false;
    });

    /* === PUBLICAR NA GALERIA === */
    btnPublish.addEventListener("click", async () => {
      if (!currentUser) return alert("Faça login para publicar.");
      if (!lastGeneratedImageURL) return;

      publishStatus.textContent = "Publicando...";
      btnPublish.disabled = true;

      try {
        await addDoc(collection(db, "gallery"), {
          title: promptInput.value.trim() || "Sem título",
          imageUrl: lastGeneratedImageURL,
          createdAt: Date.now(),
          userName: currentUser.displayName,
          userEmail: currentUser.email,
          likes: 0
        });

        publishStatus.textContent = "Publicado!";
        loadGallery();

      } catch (err) {
        console.error(err);
        publishStatus.textContent = "Erro ao publicar.";
      }

      btnPublish.disabled = false;
    });

    /* === CARREGAR GALERIA === */
    async function loadGallery() {
      gallery.innerHTML = "<div style='color:#9ca3af;font-size:0.9rem;'>Carregando...</div>";

      const q = query(collection(db, "gallery"), orderBy("createdAt", "desc"));
      const snap = await getDocs(q);

      let html = "";

      snap.forEach(docSnap => {
        const data = docSnap.data();
        const id = docSnap.id;

        html += `
          <div class="masonry-item">
            <img src="${data.imageUrl}" />
            <div class="masonry-info">
              <div class="masonry-title">${data.title}</div>
              <div class="masonry-actions">
                <button class="like-btn" data-id="${id}">❤️ ${data.likes}</button>
                ${
                  isAdmin
                    ? `<span class="admin-remove" data-id="${id}">remover</span>`
                    : ""
                }
              </div>
            </div>
          </div>
        `;
      });

      gallery.innerHTML = html;

      // Likes
      gallery.querySelectorAll(".like-btn").forEach(btn => {
        btn.addEventListener("click", async () => {
          const id = btn.getAttribute("data-id");
          const docRef = doc(db, "gallery", id);

          const currentLikes = parseInt(btn.textContent.replace("❤️", "").trim());
          await updateDoc(docRef, { likes: currentLikes + 1 });

          loadGallery();
        });
      });

      // Remover (admin)
      if (isAdmin) {
        gallery.querySelectorAll(".admin-remove").forEach(btn => {
          btn.addEventListener("click", async () => {
            const id = btn.getAttribute("data-id");
            if (confirm("Remover esta imagem?")) {
              await deleteDoc(doc(db, "gallery", id));
              loadGallery();
            }
          });
        });
      }
    }

    loadGallery();
  </script>

</body>
</html>
