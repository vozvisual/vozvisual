<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Voz Visual — Neon</title>
<style>
body {
  margin:0;
  background:#050505;
  font-family:Arial;
  color:#EAEAEA;
}
header {
  padding:20px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#050505;
  border-bottom:1px solid rgba(0,200,255,0.2);
}
.logo {
  font-size:26px;
  font-weight:bold;
  color:#00C8FF;
  text-shadow:0 0 12px #00C8FF;
}
nav a {
  margin-left:20px;
  color:#FF4BFF;
  text-decoration:none;
  font-size:14px;
  text-shadow:0 0 8px #FF4BFF;
}
.hero {
  padding:120px 40px;
  text-align:center;
}
.hero h1 {
  font-size:52px;
  line-height:1.2;
  color:#00C8FF;
  text-shadow:0 0 20px #00C8FF;
}
.hero p {
  max-width:600px;
  margin:20px auto;
  color:#EAEAEA;
  font-size:18px;
}
.btn {
  padding:14px 28px;
  border:none;
  margin:10px;
  cursor:pointer;
  font-size:14px;
  border-radius:6px;
  text-transform:uppercase;
  letter-spacing:1px;
}
.btn-primary {
  background:#FF7A00;
  color:#050505;
  box-shadow:0 0 12px #FF7A00;
}
.btn-secondary {
  background:transparent;
  border:1px solid #00C8FF;
  color:#00C8FF;
  box-shadow:0 0 12px #00C8FF;
}
footer {
  margin-top:80px;
  padding:40px;
  text-align:center;
  color:#666;
}
</style>
</head>
<body>

<header>
  <div class="logo">VOZ VISUAL</div>
  <nav>
    <a href="#">Home</a>
    <a href="#">Galeria</a>
    <a href="#">Mentor</a>
    <a href="#">Ensino</a>
    <a href="#">Comunidade</a>
  </nav>
</header>

<section class="hero">
  <h1>ALGUMAS EMOÇÕES<br>NÃO TÊM PALAVRAS.<br>TÊM IMAGENS.</h1>
  <p>O Voz Visual existe no espaço entre o sentimento e o visível — onde a arte gerada por IA encontra a profundidade filosófica e a estética cinematográfica.</p>
  <button class="btn btn-primary">Fazer Parte</button>
  <button class="btn btn-secondary">Ver Galeria</button>
</section>

<footer>© 2025 Voz Visual</footer>

</body>
</html>
